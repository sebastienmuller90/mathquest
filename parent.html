<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MathQuest Parents"><link rel="apple-touch-icon" href="icon.png">
<title>MathQuest Parents</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link href="fonts/fonts.css" rel="stylesheet"><!-- polices locales (hors ligne) -->
<style>:root{--bg:#f4f1ff;--surface:#ffffff;--surface2:#ece7ff;--text:#1f1a3d;--muted:#6a6590;--border:#ddd5fb;--good:#15803d;--goodbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--gold:#f59e0b;--accent:#7c3aed;--edge:rgba(31,26,61,.12);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130f29;--surface:#1f1a3f;--surface2:#2b2554;--text:#f4f1ff;--muted:#a8a1d4;--border:#3a3370;--good:#4ade80;--goodbg:#12351f;--bad:#f87171;--badbg:#3d1219;--edge:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130f29;--surface:#1f1a3f;--surface2:#2b2554;--text:#f4f1ff;--muted:#a8a1d4;--border:#3a3370;--good:#4ade80;--goodbg:#12351f;--bad:#f87171;--badbg:#3d1219;--edge:rgba(0,0,0,.45);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:500 17px/1.5 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 background-image:radial-gradient(circle at 12% -5%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 42%),radial-gradient(circle at 95% 105%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 40%);background-attachment:fixed}
h1,h2,.btn,.pill,.qtext,.nm,.world,.tool,.choice,.kpi b,.bigstars,.end h1,.lvlup,.combo,.ring text,input.big{font-family:'Fredoka','Nunito',system-ui,sans-serif}
h1{font-size:24px;margin:0;font-weight:600}h2{font-weight:600}
#app{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.muted{color:var(--muted)}.center{text-align:center}.lead{font-size:19px;margin:.3em 0}
.card{background:var(--surface);border:2px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--edge)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:16px;padding:12px 18px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--border);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:20px}
.btn.big{font-size:21px;padding:16px 22px;width:100%;margin-top:14px}
.btn.wide{width:100%;margin-top:10px}
.btn.danger{color:var(--bad);margin-top:28px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--border);border-radius:999px;padding:4px 12px;font-weight:600;font-size:16px;white-space:nowrap;cursor:default}
button.pill{cursor:pointer}.pill.fire{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
/* accueil */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.av{width:62px;height:62px;flex:none;border-radius:50%;border:3px solid var(--accent);background:var(--surface2);font-size:34px;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.who{flex:1;min-width:0}.nm{font-size:22px;font-weight:600;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tt{font-size:14px;color:var(--muted)}
.xpbar,.prog,.mbar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.xpbar i,.prog i,.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--gold)));border-radius:99px;transition:width .4s}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.goal{display:flex;align-items:center;gap:14px;padding:12px 16px}
.ring{width:56px;height:56px;flex:none;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6}.rb{stroke:var(--surface2)}.rf{stroke:var(--gold);stroke-dasharray:138.2;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{transform:rotate(90deg);transform-origin:26px 26px;fill:var(--text);font-size:15px;font-weight:600}
.reco{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;text-align:left;cursor:pointer;border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.reco .ri{font-size:38px}.reco>span:nth-child(2){flex:1;display:flex;flex-direction:column}.reco small{color:var(--muted)}.reco b{font-family:'Fredoka',sans-serif;font-size:20px}
.reco .go{background:var(--accent);color:#fff;border-radius:14px;padding:8px 16px;font-family:'Fredoka',sans-serif;font-weight:600}
.sec{font-size:20px;margin:22px 0 10px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.world{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px;border-radius:24px;border:0;cursor:pointer;color:#fff;min-height:150px;overflow:hidden;
 background:linear-gradient(150deg,color-mix(in srgb,var(--wc) 80%,#fff),var(--wc) 55%,color-mix(in srgb,var(--wc) 70%,#000));box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 50%,#000);transition:transform .12s}
.world:hover{transform:translateY(-2px) rotate(-.5deg)}.world:active{transform:translateY(3px)}
.we{font-size:52px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}.wl{font-size:30px;font-weight:700;line-height:1;margin-top:6px}.wn{font-size:15px;opacity:.95}.ws{margin-top:auto;font-size:15px;background:rgba(0,0,0,.2);border-radius:99px;padding:2px 10px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:20px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 4px 0 var(--edge);text-align:center}
.tool span{font-size:28px}
/* écrans secondaires */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}.bar h1{flex:1;font-size:22px;min-width:0}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.chap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;border:2px solid var(--border);border-left:8px solid var(--wc);background:var(--surface);cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.ci{font-size:30px;grid-row:span 2}.cn{font-weight:700}.cp{font-size:13px;grid-column:2}
.st{color:var(--gold);letter-spacing:1px}.st i{font-style:normal;color:var(--surface2)}
.fiche{margin-bottom:6px}.fh{font-weight:700;color:var(--accent)}.fiche h2{margin:.2em 0 .5em;font-size:24px}.fiche ul{padding-left:1.2em;margin:0}.fiche li{margin:.35em 0;font-size:18px}
.ex{margin-top:14px;background:var(--surface2);border-radius:16px;padding:12px 14px;font-size:18px}
/* questions */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}.qtop .prog{flex:1;height:16px;margin:0}.prog.t i{background:linear-gradient(90deg,var(--gold),var(--bad));transition:width .1s linear}
.combo{font-family:'Fredoka',sans-serif;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}.combo.hot,.hot{color:#fff;background:linear-gradient(90deg,#f97316,#ef4444);border-radius:99px;padding:2px 10px}
.qtag{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}
.qtext{font-size:25px;line-height:1.4;margin:6px 0 10px}.qtext b{color:var(--accent)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 .15em}.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.fig{display:block;width:100%;max-width:300px;margin:6px auto 10px}.fig .sh{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.fig .ln,.fig .ac{fill:none;stroke:var(--text);stroke-width:2.5}.fig .ac{stroke:var(--gold);stroke-width:4}.fig .ray{stroke:var(--text);stroke-width:3.5;stroke-linecap:round}.fig .dot{fill:var(--accent)}.fig text{fill:var(--text);font:600 16px 'Fredoka',system-ui,sans-serif}
.inrow{display:flex;align-items:center;gap:10px}.unit{font-size:22px;font-weight:700;color:var(--muted)}
input.big{width:100%;font-size:28px;font-weight:600;padding:12px 16px;border-radius:16px;border:3px solid var(--border);background:var(--surface2);color:var(--text);outline:none;min-width:0}
input.big:focus{border-color:var(--accent)}input.good{border-color:var(--good);background:var(--goodbg)}input.bad{border-color:var(--bad);background:var(--badbg)}
.ml{display:flex;align-items:center;gap:10px;margin:8px 0}.ml span{min-width:92px;font-weight:700;font-size:18px}
.chips{display:flex;gap:8px;margin-top:10px}.chip{min-width:48px;padding:6px 12px;border-radius:12px;border:2px solid var(--border);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;border-radius:18px;border:3px solid var(--border);background:var(--surface2);font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.choice kbd{font:600 13px 'Nunito',sans-serif;background:var(--surface);border-radius:8px;padding:2px 7px;color:var(--muted)}
.choice.good{border-color:var(--good);background:var(--goodbg)}.choice.bad{border-color:var(--bad);background:var(--badbg)}.choice:disabled{cursor:default}
.qbtns{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.qbtns .primary{flex:1}
.fb{margin-top:14px;border-radius:18px;padding:14px 16px;font-size:18px}.fb.good{background:var(--goodbg);color:var(--good)}.fb.bad{background:var(--badbg)}.fb.bad>b:first-child{color:var(--bad)}
.fb.tip{background:color-mix(in srgb,var(--gold) 18%,var(--surface));display:flex;flex-direction:column;gap:4px}.fb small{color:var(--muted)}
.expl{margin-top:8px;padding-top:8px;border-top:2px dashed var(--border);color:var(--text)}
/* fin */
.end{text-align:center}.end h1{font-size:44px}.bigicon{font-size:72px}
.bigstars{font-size:70px;letter-spacing:6px;line-height:1.1}.bigstars span{color:var(--surface2);display:inline-block}.bigstars span.on{color:var(--gold);animation:starpop .5s both}
.gains{display:flex;justify-content:center;gap:10px;margin:10px 0}.gains span{background:var(--surface2);border-radius:99px;padding:6px 16px;font-weight:700;font-size:18px}
.lvlup{font-size:28px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--accent),#ec4899);border-radius:18px;padding:10px;margin-bottom:10px;animation:starpop .6s both}.lvlup small{display:block;font-size:16px;opacity:.9}
.nb{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-radius:14px;padding:10px;margin:8px 0;font-weight:700}
.pause{background:color-mix(in srgb,#22c55e 16%,var(--surface));border:2px dashed #22c55e;border-radius:16px;padding:12px;margin:10px 0;text-align:left}
.col{display:flex;flex-direction:column}
/* boutique, badges, parents */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:20px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;box-shadow:0 4px 0 var(--edge)}
.item .ie{font-size:40px}.item small{color:var(--muted);font-weight:700}.item.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}.item.lock{opacity:.55}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface2)}
.badge{cursor:default}.badge.off{opacity:.45;filter:grayscale(1)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:12px;text-align:center}.kpi b{display:block;font-size:24px}.kpi span{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;margin-bottom:8px;border-radius:16px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:left}
.lo{color:var(--bad)}.mid{color:var(--gold)}
.det{padding:12px 16px;margin-bottom:10px}.det summary{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700;list-style:none}.det summary::-webkit-details-marker{display:none}.det .mbar{flex:1;margin:0}
.drow{display:grid;grid-template-columns:1fr auto 64px;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:15px}.drow span:last-child{text-align:right}
.rdrow{align-items:center}.rdrow .mbar{width:64px;margin:0}.rdrow b{text-align:right}.rdtx{grid-template-columns:1fr auto}
/* accueil initial */
.onb{text-align:center;margin-top:6vh}.logo{font-size:72px}.onb h1{font-size:42px}.lab{display:block;text-align:left;font-weight:700;margin:16px 0 6px}.lab input{margin-top:6px}
.avs{display:flex;justify-content:center;gap:12px}.avb{font-size:42px;width:76px;height:76px;border-radius:50%;border:3px solid var(--border);background:var(--surface2);cursor:pointer}.avb.sel{border-color:var(--accent);transform:scale(1.08)}
/* animations */
.pop{animation:pop .35s both}.slide{animation:slide .3s both}.shake{animation:shake .35s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:none}}
.cf{position:fixed;top:45vh;width:10px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:cf 1.5s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}30%{transform:translate(calc(var(--dx)*.5),-28vh) rotate(calc(var(--r)*.4))}100%{transform:translate(var(--dx),55vh) rotate(var(--r));opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:600;z-index:100;transition:transform .3s;width:max-content;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.tools,.kpis{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.qtext{font-size:22px}.world{min-height:130px}.we{font-size:42px}.pills .pill{font-size:14px;padding:3px 8px}.av{width:52px;height:52px;font-size:28px}}
.merit{border-color:color-mix(in srgb,var(--gold) 55%,var(--border))}.merit.ready{border-color:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 45%,transparent)}
.rdy{color:var(--good);font-weight:700;font-size:15px}
.mbal{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.mbal b{font-family:'Fredoka',sans-serif;font-size:44px;line-height:1.1}
.rq,.rw2{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:12px 14px;flex-wrap:wrap}.rw2.ready{border-color:var(--good)}.re{font-size:34px}.grow{flex:1;min-width:0}
.rw2 .mbar{margin:6px 0 2px}.rw2 .mbar i{background:linear-gradient(90deg,var(--gold),var(--good))}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tab{flex:1;padding:10px 12px;border-radius:14px;border:2px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}.dotn{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:13px}
.frow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.fld{font:600 17px 'Nunito',system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);color:var(--text);min-width:0}.fld:focus{outline:none;border-color:var(--accent)}
.fld.em{width:62px;text-align:center;font-size:22px;padding:6px}.fld.num{width:90px}.fld.grow{flex:1;min-width:140px}
.btn.sm2{padding:8px 12px;font-size:16px}.btn.grow{flex:1}
.drow2{display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:15px}.okc{color:var(--good)}
.small{font-size:14px}.how{margin:0;padding-left:1.2em}.how li{margin:.35em 0}
.pin{text-align:center;letter-spacing:.3em;margin-top:10px}
.reckey{font-family:'Fredoka',sans-serif;font-size:36px;letter-spacing:.12em;background:var(--surface2);border-radius:16px;padding:12px;margin:14px 0;user-select:all}
.linkb{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;margin-top:12px;font-weight:700}
.qr{background:#fff;border-radius:16px;padding:10px;width:220px;max-width:100%;margin:10px auto}.qr svg{display:block;width:100%;height:auto}
.fld.wide2{width:100%;font-size:14px;margin:8px 0}.fld.ta{width:100%;min-height:110px;font-size:12px;font-family:ui-monospace,monospace;margin:6px 0;resize:vertical}
.live{display:inline-flex;align-items:center;gap:6px}.live i{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}.live.off i{background:var(--muted);box-shadow:none}
.note{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:14px;padding:10px 14px;font-size:15px;margin:10px 0}
.rq .grow{min-width:150px}
@media (max-width:560px){.rw .fld.grow{flex-basis:100%;order:-1}.rw{padding-bottom:8px;border-bottom:1px solid var(--border)}.tab{padding:8px;font-size:15px}.rq .btn{flex:1}}
/* chapitres avec 2 actions */
.chap{grid-template-rows:auto auto auto}.chap .cbtn{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}.chap .cbtn .btn{flex:1}
.btn.hi{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.chap.lsn{cursor:pointer}
.tools{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.tools{grid-template-columns:repeat(3,1fr)}}
/* cours */
.ldots{display:flex;gap:6px;justify-content:center;margin:0 0 12px}.ldots i{width:28px;height:8px;border-radius:99px;background:var(--surface2)}.ldots i.done{background:color-mix(in srgb,var(--accent) 45%,var(--surface2))}.ldots i.on{background:var(--accent);width:44px}
.lcard h2{font-size:26px;margin:.15em 0 .6em}.ltag{font-size:14px;color:var(--muted);font-weight:700}
.lcard{font-size:18px;line-height:1.6}.lcard b{color:var(--accent)}
.bubble{display:flex;gap:14px;align-items:flex-start}.bav{flex:none;width:64px;height:64px;border-radius:50%;background:var(--surface2);border:3px solid var(--accent);font-size:36px;display:grid;place-items:center}
.bubble>div{position:relative;background:var(--surface2);border-radius:4px 20px 20px 20px;padding:14px 16px;font-size:19px}
.lst{padding-left:1.4em;margin:.4em 0}.lst li{margin:.4em 0;padding-left:.2em}.lst li::marker{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--accent)}
.tip{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border-radius:14px;padding:10px 14px;margin:12px 0;font-size:17px}
.pose{font:600 20px/1.45 ui-monospace,'Cascadia Mono',Consolas,monospace;background:#fffef8;color:#1f2937;border-radius:14px;padding:12px 16px;margin:12px 0;overflow-x:auto;
 background-image:linear-gradient(#d9e6ff 1px,transparent 1px),linear-gradient(90deg,#d9e6ff 1px,transparent 1px);background-size:14px 14px}

<script>/* ===== Utilitaires ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const rd=x=>Math.round(x*1e6)/1e6;
const F=x=>rd(x).toLocaleString('fr-FR',{maximumFractionDigits:6}).replace(/-/g,'−');
const Pn=x=>x<0?`(${F(x)})`:F(x);
const nz=(a,b)=>{let x=0;while(x===0)x=R(a,b);return x;};
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const sup=n=>`<sup>${n}</sup>`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const affine=(a,b)=>{let s=a===0?'':a===1?'x':a===-1?'−x':F(a)+'x';if(b===0)return s||'0';if(!s)return F(b);return s+(b>0?` + ${b}`:` − ${-b}`);};

const Q={
  num:(q,ans,o={})=>({type:'num',q,ans:rd(ans),...o}),
  frac:(q,n,d,o={})=>({type:'frac',q,ans:[n,d],...o}),
  txt:(q,acc,o={})=>({type:'text',q,acc,...o}),
  multi:(q,labels,ans,o={})=>({type:'multi',q,labels,ans,...o}),
  ch:(q,good,bad,o={})=>{const c=shuffle([good,...bad]);return{type:'choice',q,choices:c,ans:c.indexOf(good),...o};}
};

/* ===== Kit langues ===== */
const E=t=>`<span lang="en">${t}</span>`,IT=t=>`<span lang="it">${t}</span>`;
const LW=l=>l==='en'?E:IT,LNM=l=>l==='en'?'anglais':'italien',LV=l=>l==='en'?'en-GB':'it-IT';
function vq(bank,lang,d){const W=LW(lang),it=P(bank),tg=String(it[1]).split(';'),oth=shuffle(bank.filter(b=>b!==it&&b[0]!==it[0]&&String(b[1]).split(';')[0]!==tg[0])).slice(0,3);
 const f=d===1?R(0,1):d===2?R(1,2):R(2,3),ex=`« ${it[0]} » = ${W(tg[0])}`;
 if(f===0)return Q.ch(`Comment dit-on <b>« ${it[0]} »</b> en ${LNM(lang)} ?`,W(tg[0]),oth.map(o=>W(String(o[1]).split(';')[0])),{lang,hint:`Ça commence par « ${tg[0][0]} ».`,expl:ex});
 if(f===1)return Q.ch(`Que veut dire ${W('<b>'+tg[0]+'</b>')} ?`,it[0],oth.map(o=>o[0]),{lang,hint:'Clique sur le mot pour l’écouter.',expl:ex});
 if(f===2)return Q.ch('🎧 Écoute, puis choisis la traduction.',it[0],oth.map(o=>o[0]),{lang,audio:{t:tg[0],l:LV(lang)},hint:'Réécoute en mode lent si besoin.',expl:`Tu as entendu ${W(tg[0])}. ${ex}`});
 return Q.txt(`Écris en ${LNM(lang)} : <b>« ${it[0]} »</b>`,tg,{lang,hint:`Ça commence par « ${tg[0][0]} » (${tg[0].length} lettres).`,expl:ex});}
function fq(items,lang,d){const W=LW(lang),[s,a,w,fr,h]=P(items),acc=a.split(';'),wr=w.split('|');
 const gap=s.replace('___','<span class="gap">___</span>'),tr=fr?`<div class="trad">${fr}</div>`:'',ex=W(s.replace('___','<b>'+acc[0]+'</b>'));
 if(d===1||(d===2&&Math.random()<.5))return Q.ch(`Complète : ${W(gap)}${tr}`,W(acc[0]),shuffle(wr).slice(0,3).map(W),{lang,hint:h||'Relis la phrase et sa traduction.',expl:ex});
 return Q.txt(`Complète : ${W(gap)}${tr}`,acc,{lang,hint:h||`Ça commence par « ${acc[0][0]} ».`,expl:ex});}
function oq(items,lang){const [s,fr]=P(items),toks=s.replace(/[.?!]$/,'').split(' ');let sh=shuffle([...toks]),k=0;while(sh.join(' ')===toks.join(' ')&&toks.length>1&&k++<20)sh=shuffle([...toks]);
 return {type:'order',q:`Remets les mots dans l’ordre :<div class="trad">« ${fr} »</div>`,tokens:sh,ans:toks.join(' '),lang,hint:`La phrase commence par « ${toks[0]} ».`,expl:LW(lang)(s)};}
function lmix(d,lang,o){const g=[];if(o.v)g.push(()=>vq(o.v,lang,d));if(o.f)g.push(()=>fq(o.f,lang,d));if(o.x){g.push(()=>o.x(d));g.push(()=>o.x(d));}if(o.o&&(d>1||g.length===0))g.push(()=>oq(o.o,lang));return P(g)();}

/* ===== Figures SVG ===== */
const SV={
  rect:(a,b)=>`<svg class="fig" viewBox="0 0 260 150" aria-hidden="true"><rect x="50" y="20" width="160" height="90" rx="4" class="sh"/><text x="130" y="138" text-anchor="middle">${a}</text><text x="218" y="70">${b}</text></svg>`,
  tri:(ab,ac,bc)=>`<svg class="fig" viewBox="0 0 260 172" aria-hidden="true"><path d="M50 140 L220 140 L50 25 Z" class="sh"/><path d="M50 124 L66 124 L66 140" class="ln"/><text x="34" y="158">A</text><text x="226" y="158">B</text><text x="34" y="24">C</text><text x="135" y="164" text-anchor="middle">${ab}</text><text x="42" y="88" text-anchor="end">${ac}</text><text x="150" y="76">${bc}</text></svg>`,
  angle:v=>{const r=v*Math.PI/180,ox=130,oy=120,L=105;const x2=ox+L*Math.cos(r),y2=oy-L*Math.sin(r);const ax=ox+30*Math.cos(r),ay=oy-30*Math.sin(r);
    const arc=v===90?`<path d="M${ox+18} ${oy} L${ox+18} ${oy-18} L${ox} ${oy-18}" class="ln"/>`:`<path d="M${ox+30} ${oy} A30 30 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" class="ac"/>`;
    return `<svg class="fig" viewBox="0 0 260 140" aria-hidden="true"><line x1="${ox}" y1="${oy}" x2="${ox+115}" y2="${oy}" class="ray"/><line x1="${ox}" y1="${oy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="ray"/>${arc}<circle cx="${ox}" cy="${oy}" r="5" class="dot"/></svg>`;},
  thales:()=>`<svg class="fig" viewBox="0 0 260 172" aria-hidden="true"><path d="M130 20 L30 150 L230 150 Z" class="sh"/><line x1="84" y1="79.8" x2="176" y2="79.8" class="ray"/><text x="124" y="15">A</text><text x="12" y="164">B</text><text x="236" y="164">C</text><text x="62" y="82">M</text><text x="182" y="82">N</text></svg>`
};

/* ===== Correction ===== */
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.');if(!s)return NaN;
  if(s.includes('/')){const p=s.split('/');if(p.length!==2||p[0]===''||p[1]==='')return NaN;const x=Number(p[0]),y=Number(p[1]);if(!isFinite(x)||!isFinite(y)||y===0)return NaN;return x/y;}
  if(!/^[-+]?\d*\.?\d+$/.test(s))return NaN;return Number(s);}
function normTxt(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/−/g,'-').replace(/[*×]/g,'').replace(/,/g,'.').replace(/\^2/g,'²');}
const CONTR={"i'm":'i am',"you're":'you are',"we're":'we are',"they're":'they are',"he's":'he is',"she's":'she is',"it's":'it is',"isn't":'is not',"aren't":'are not',"wasn't":'was not',"weren't":'were not',"don't":'do not',"doesn't":'does not',"didn't":'did not',"can't":'cannot',"won't":'will not',"haven't":'have not',"hasn't":'has not',"i've":'i have',"you've":'you have',"we've":'we have',"they've":'they have',"shouldn't":'should not',"couldn't":'could not',"wouldn't":'would not',"mustn't":'must not',"there's":'there is',"i'll":'i will',"you'll":'you will',"he'll":'he will',"she'll":'she will',"we'll":'we will',"they'll":'they will',"i'd":'i would',"'ve":'have',"'m":'am',"'re":'are',"'ll":'will',"'d":'would'};
function normLang(s,lang){s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:«»"()…]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim();
 if(lang==='en')s=s.split(' ').map(w=>CONTR[w]||w).join(' ').replace(/\bcan not\b/g,'cannot');return s;}
function check(q,v){
  if(q.type==='order')return normLang(v,q.lang)===normLang(q.ans,q.lang);
  if(q.type==='text'&&q.lang){const n=normLang(v,q.lang);return q.acc.some(a=>normLang(a,q.lang)===n);}
  if(q.type==='choice')return v===q.ans;
  if(q.type==='num'){const x=parseNum(v);return !isNaN(x)&&Math.abs(x-q.ans)<=(q.tol||1e-6);}
  if(q.type==='frac'){const x=parseNum(v),t=q.ans[0]/q.ans[1];if(isNaN(x)||Math.abs(x-t)>1e-6)return false;
    if(q.simplest){const s=String(v).replace(/\s/g,'').replace(/−/g,'-');if(!s.includes('/'))return Number.isInteger(t);const [a,b]=s.split('/').map(Number);return Number.isInteger(a)&&Number.isInteger(b)&&b>0&&gcd(a,b)===1;}
    return true;}
  if(q.type==='text'){const n=normTxt(v);return q.acc.some(a=>normTxt(a)===n);}
  if(q.type==='multi'){const xs=v.map(parseNum);if(xs.some(isNaN))return false;let a=[...q.ans],b=[...xs];if(q.unordered){a.sort((p,r)=>p-r);b.sort((p,r)=>p-r);}return a.every((y,i)=>Math.abs(y-b[i])<1e-6);}
  return false;}
function answerText(q){
  if(q.type==='choice')return q.choices[q.ans];
  if(q.type==='num')return F(q.ans)+(q.unit?' '+q.unit:'');
  if(q.type==='frac')return `${q.ans[0]}/${q.ans[1]}`;
  if(q.type==='order')return q.ans;
  if(q.type==='text'&&q.lang)return q.acc[0];
  if(q.type==='text')return q.acc[0].replace(/-/g,' − ').replace(/\+/g,' + ');
  if(q.type==='multi')return q.labels.map((l,i)=>`${l} = ${F(q.ans[i])}`).join(' et ');
}

/* ===== Programme 6e → 3e ===== */
const CH={
'6':[
{id:'6a',name:'Comparer les décimaux',icon:'🔢',
 f:{t:'Comparer des nombres décimaux',l:['Compare d’abord la partie entière (avant la virgule).','Si elle est pareille, compare les dixièmes, puis les centièmes…','Astuce : ajoute des zéros. 3,5 = 3,50'],ex:'3,5 > 3,45 car 3,50 > 3,45'},
 g(d){const b=R(0,d*4+1),ks=[10,100,1000].slice(0,d),s=new Set();let k=0;while(s.size<4&&k++<200){const m=P(ks);s.add(rd(b+R(1,m-1)/m));}while(s.size<4)s.add(rd(b+s.size+.5));
  const a=[...s],big=Math.random()<.5,t=big?Math.max(...a):Math.min(...a);
  return Q.ch(`Quel est le <b>plus ${big?'grand':'petit'}</b> nombre ?`,F(t),a.filter(x=>x!==t).map(F),{hint:'Écris-les tous avec 3 chiffres après la virgule, puis compare.',expl:`Avec 3 décimales : ${a.map(x=>x.toFixed(3).replace('.',',')).join(' ; ')}. Le plus ${big?'grand':'petit'} est ${F(t)}.`});}},
{id:'6b',name:'Additionner, soustraire',icon:'➕',
 f:{t:'Poser une addition de décimaux',l:['Aligne les virgules les unes sous les autres.','Complète avec des zéros si besoin.','Calcule comme avec des entiers, puis replace la virgule.'],ex:'12,5 + 3,75 = 12,50 + 3,75 = 16,25'},
 g(d){let a=rd(d===1?R(11,99)/10:R(101,999)/(d===2?10:100)),b=rd(d===3?R(11,999)/100:R(11,99)/10);const h='Aligne les virgules et complète avec des zéros.';
  if(Math.random()<.5){if(a<b)[a,b]=[b,a];const r=rd(a-b);return Q.num(`${F(a)} − ${F(b)} = ?`,r,{hint:h,expl:`${F(a)} − ${F(b)} = ${F(r)}`});}
  const r=rd(a+b);return Q.num(`${F(a)} + ${F(b)} = ?`,r,{hint:h,expl:`${F(a)} + ${F(b)} = ${F(r)}`});}},
{id:'6c',name:'Multiplier',icon:'✖️',
 f:{t:'Multiplier',l:['Les tables de multiplication sont la base de tout.','× 10, × 100, × 1000 : la virgule avance de 1, 2 ou 3 rangs vers la droite.','Décimal × entier : calcule sans la virgule, puis replace-la.'],ex:'2,5 × 4 = 10 et 3,7 × 100 = 370'},
 g(d){let a,b;if(d===1){a=R(2,10);b=R(2,10);}else if(d===2){a=R(11,99);b=R(2,9);}else if(Math.random()<.5){a=rd(R(11,999)/100);b=P([10,100,1000]);}else{a=rd(R(11,99)/10);b=R(2,9);}
  const r=rd(a*b);return Q.num(`${F(a)} × ${F(b)} = ?`,r,{hint:b>=10?'La virgule se déplace vers la droite d’autant de rangs que de zéros.':'Décompose : 23 × 4 = 20 × 4 + 3 × 4.',expl:`${F(a)} × ${F(b)} = ${F(r)}`});}},
{id:'6d',name:'Division euclidienne',icon:'➗',
 f:{t:'Division euclidienne',l:['a = b × quotient + reste','Le reste est toujours plus petit que le diviseur.','Cherche le plus grand multiple du diviseur qui ne dépasse pas a.'],ex:'47 = 5 × 9 + 2 : quotient 9, reste 2'},
 g(d){const b=R(2,[9,12,25][d-1]),q=R(3,[12,30,60][d-1]),r=R(0,b-1),a=b*q+r;
  return Q.multi(`Division euclidienne de <b>${a}</b> par <b>${b}</b>`,['Quotient','Reste'],[q,r],{hint:`Cherche le plus grand multiple de ${b} inférieur ou égal à ${a}.`,expl:`${a} = ${b} × ${q} + ${r}`});}},
{id:'6e',name:'Fraction d’une quantité',icon:'🍕',
 f:{t:'Prendre une fraction d’une quantité',l:['Pour calculer 3/4 de 20 :','1) divise par le dénominateur : 20 ÷ 4 = 5','2) multiplie par le numérateur : 5 × 3 = 15'],ex:'3/4 de 20 = 15'},
 g(d){const den=P(d===1?[2,4,10]:[2,3,4,5,6,8,10]),k=R(2,[5,10,15][d-1]),tot=den*k,n=R(1,den-1),r=n*k,o=P(['bonbons','euros','billes','minutes']);
  return Q.num(`Calcule ${fr(n,den)} de <b>${tot}</b> ${o}.`,r,{hint:`Commence par ${tot} ÷ ${den}.`,expl:`${tot} ÷ ${den} = ${k}, puis ${k} × ${n} = ${r}`});}},
{id:'6f',name:'Périmètre et aire',icon:'📐',
 f:{t:'Rectangle et carré',l:['Périmètre = longueur du tour (en cm).','Rectangle : P = 2 × (L + l) et A = L × l (en cm²)','Carré : P = 4 × c et A = c × c'],ex:'Rectangle 5 cm sur 3 cm : P = 16 cm, A = 15 cm²'},
 g(d){const sq=d===3&&Math.random()<.5,L=R(3,[8,12,20][d-1]),l=sq?L:R(2,L-1),fig=sq?`un carré de côté ${L} cm`:`un rectangle de ${L} cm sur ${l} cm`,svg=SV.rect(L+' cm',l+' cm');
  if(Math.random()<.5){const r=2*(L+l);return Q.num(`<b>Périmètre</b> de ${fig} ?`,r,{unit:'cm',svg,hint:'Le périmètre, c’est le tour : additionne les 4 côtés.',expl:sq?`4 × ${L} = ${r} cm`:`2 × (${L} + ${l}) = ${r} cm`});}
  const r=L*l;return Q.num(`<b>Aire</b> de ${fig} ?`,r,{unit:'cm²',svg,hint:'Aire = longueur × largeur.',expl:`${L} × ${l} = ${r} cm²`});}},
{id:'6g',name:'Aire du triangle',icon:'🔺',
 f:{t:'Aire d’un triangle',l:['A = base × hauteur ÷ 2','Triangle rectangle : base et hauteur sont les 2 côtés de l’angle droit.','C’est la moitié d’un rectangle.'],ex:'Côtés 6 cm et 4 cm : 6 × 4 ÷ 2 = 12 cm²'},
 g(d){const m=[8,12,20][d-1];let a=R(2,m),b=R(2,m);if(a*b%2)b++;const r=a*b/2;
  return Q.num(`Triangle rectangle en A : AB = <b>${a} cm</b>, AC = <b>${b} cm</b>. Son aire ?`,r,{unit:'cm²',svg:SV.tri(a+' cm',b+' cm',''),hint:'C’est la moitié du rectangle de mêmes dimensions.',expl:`${a} × ${b} ÷ 2 = ${r} cm²`});}},
{id:'6h',name:'Les angles',icon:'📏',
 f:{t:'Nature d’un angle',l:['Aigu : entre 0° et 90°','Droit : exactement 90° (le coin d’une feuille)','Obtus : entre 90° et 180°. Plat : 180°'],ex:'45° est aigu, 120° est obtus'},
 g(){const k=R(0,3),v=[R(10,85),90,R(95,175),180][k],N=['aigu','droit','obtus','plat'];
  return Q.ch(`Un angle de <b>${v}°</b> est…`,N[k],N.filter((_,i)=>i!==k),{svg:SV.angle(v),hint:'Compare avec 90° (droit) et 180° (plat).',expl:`${v}° : angle ${N[k]}.`});}},
{id:'6i',name:'Proportionnalité',icon:'🛒',
 f:{t:'Passer par l’unité',l:['Trouve d’abord le prix d’un seul objet.','Puis multiplie par le nombre voulu.'],ex:'3 cahiers = 6 € → 1 cahier = 2 € → 5 cahiers = 10 €'},
 g(d){const it=P([['cahier','cahiers'],['croissant','croissants'],['stylo','stylos'],['ticket','tickets']]),p=d===1?R(2,5):d===2?R(2,12):rd(R(12,45)/10),n1=R(2,6);let n2=R(2,12);if(n2===n1)n2++;const p1=rd(p*n1),r=rd(p*n2);
  return Q.num(`${n1} ${it[1]} coûtent <b>${F(p1)} €</b>. Combien coûtent <b>${n2}</b> ${it[1]} ?`,r,{unit:'€',hint:`Trouve d’abord le prix d’un seul ${it[0]}.`,expl:`1 ${it[0]} = ${F(p1)} ÷ ${n1} = ${F(p)} €, donc ${n2} × ${F(p)} = ${F(r)} €`});}},
{id:'6j',name:'Conversions',icon:'🔄',
 f:{t:'Convertir des longueurs',l:['km | hm | dam | m | dm | cm | mm','Vers une unité plus petite : × 10 par colonne.','Vers une unité plus grande : ÷ 10 par colonne.'],ex:'3,5 m = 350 cm et 1 200 m = 1,2 km'},
 g(d){const U=['km','hm','dam','m','dm','cm','mm'];let i,j;do{i=R(0,6);j=i+P([-1,1])*R(1,Math.min(3,d+1));}while(j<0||j>6);const v=d===1?R(1,20):rd(R(11,999)/10),g=Math.abs(j-i),r=rd(v*Math.pow(10,j-i));
  return Q.num(`${F(v)} ${U[i]} = ? ${U[j]}`,r,{unit:U[j],hint:j>i?'Unité plus petite : le nombre devient plus grand (× 10 par colonne).':'Unité plus grande : le nombre devient plus petit (÷ 10 par colonne).',expl:`${g} colonne${g>1?'s':''} : ${j>i?'×':'÷'} ${Math.pow(10,g)}, donc ${F(v)} ${U[i]} = ${F(r)} ${U[j]}`});}}
],
'5':[
{id:'5a',name:'Priorités opératoires',icon:'🧮',
 f:{t:'L’ordre des calculs',l:['1) Les parenthèses','2) Les × et ÷','3) Les + et −, de gauche à droite'],ex:'2 + 3 × 4 = 2 + 12 = 14'},
 g(d){const a=R(2,9),b=R(2,9),c=R(2,9),t=d===1?R(0,1):d===2?R(2,4):R(5,6);let q,r,e;
  switch(t){case 0:r=a+b*c;q=`${a} + ${b} × ${c}`;e=`× d’abord : ${b} × ${c} = ${b*c}, puis ${a} + ${b*c} = ${r}`;break;
   case 1:r=a*b+c;q=`${a} × ${b} + ${c}`;e=`${a} × ${b} = ${a*b}, puis ${a*b} + ${c} = ${r}`;break;
   case 2:r=(a+b)*c;q=`(${a} + ${b}) × ${c}`;e=`Parenthèses : ${a} + ${b} = ${a+b}, puis ${a+b} × ${c} = ${r}`;break;
   case 3:{const A=b*c+R(1,20);r=A-b*c;q=`${A} − ${b} × ${c}`;e=`${b} × ${c} = ${b*c}, puis ${A} − ${b*c} = ${r}`;break;}
   case 4:{const B=b*c;r=a+c;q=`${a} + ${B} ÷ ${b}`;e=`÷ d’abord : ${B} ÷ ${b} = ${c}, puis ${a} + ${c} = ${r}`;break;}
   case 5:{const h=b+R(1,6);r=a*(h-b)+c;q=`${a} × (${h} − ${b}) + ${c}`;e=`${h} − ${b} = ${h-b}, puis ${a} × ${h-b} = ${a*(h-b)}, puis + ${c} = ${r}`;break;}
   default:{const h=c+R(1,5);r=(a+b)*(h-c);q=`(${a} + ${b}) × (${h} − ${c})`;e=`${a+b} × ${h-c} = ${r}`;}}
  return Q.num(q+' = ?',r,{hint:'Ordre : parenthèses, puis × et ÷, puis + et −.',expl:e});}},
{id:'5b',name:'Nombres relatifs',icon:'🌡️',
 f:{t:'Additionner des relatifs',l:['Même signe : ajoute les distances à zéro, garde le signe.','Signes contraires : soustrais les distances, garde le signe du plus éloigné de zéro.','Soustraire = ajouter l’opposé.'],ex:'−7 + 3 = −4 et 5 − (−2) = 5 + 2 = 7'},
 g(d){const L=d*10,a=nz(-L,L),b=nz(-L,L),plus=Math.random()<.5,r=plus?a+b:a-b;
  return Q.num(`${F(a)} ${plus?'+':'−'} ${Pn(b)} = ?`,r,{hint:plus?'Signes contraires : soustrais les distances à zéro, garde le signe du plus éloigné.':'Soustraire un nombre = ajouter son opposé.',expl:plus?`${F(a)} + ${Pn(b)} = ${F(r)}`:`${F(a)} − ${Pn(b)} = ${F(a)} + ${Pn(-b)} = ${F(r)}`});}},
{id:'5c',name:'Simplifier une fraction',icon:'✂️',
 f:{t:'Simplifier',l:['Divise le numérateur ET le dénominateur par le même nombre.','Recommence jusqu’à ne plus pouvoir.','Écris ta réponse comme ça : 2/3'],ex:'12/18 = 6/9 = 2/3'},
 g(d){let a,b;do{a=R(1,9);b=R(a+1,12);}while(gcd(a,b)!==1);const k=R(2,[5,9,15][d-1]);
  return Q.frac(`Simplifie au maximum : ${fr(k*a,k*b)}`,a,b,{simplest:true,hint:'Essaie de diviser en haut et en bas par 2, 3, 5 ou 7.',expl:`On divise en haut et en bas par ${k} : ${fr(k*a,k*b)} = ${fr(a,b)}`});}},
{id:'5d',name:'Additionner des fractions',icon:'🥧',
 f:{t:'Additionner des fractions',l:['Il faut le même dénominateur.','Si besoin, multiplie en haut ET en bas pour l’obtenir.','Puis ajoute les numérateurs, garde le dénominateur.'],ex:'1/3 + 1/6 = 2/6 + 1/6 = 3/6'},
 g(d){const den=R(3,10),m=d===1?1:R(2,4),D=den*m,n1=R(1,den-1),n2=R(1,D-1),N1=n1*m;let sub=d===3&&Math.random()<.5;if(sub&&N1<=n2)sub=false;const N=sub?N1-n2:N1+n2,o=sub?'−':'+';
  return Q.frac(`${fr(n1,den)} ${o} ${fr(n2,D)} = ?`,N,D,{hint:'Mets les deux fractions au même dénominateur.',expl:(m>1?`${fr(n1,den)} = ${fr(N1,D)}, donc `:'')+`${fr(N1,D)} ${o} ${fr(n2,D)} = ${fr(N,D)}`});}},
{id:'5e',name:'Calcul littéral',icon:'🔤',
 f:{t:'Remplacer une lettre',l:['3x veut dire 3 × x.','x² veut dire x × x.','Remplace x par sa valeur, puis calcule.'],ex:'Pour x = 4 : 3x + 5 = 3 × 4 + 5 = 17'},
 g(d){const a=R(2,9),b=R(1,9),x=d===3?nz(-5,5):R(1,[5,9][d-1]),t=d===1?0:d===2?R(1,2):R(3,4);let e,r;
  switch(t){case 0:e=`${a}x + ${b}`;r=a*x+b;break;case 1:e=`${a}x − ${b}`;r=a*x-b;break;case 2:e=`${a}(x + ${b})`;r=a*(x+b);break;case 3:e=`x² + ${a}x`;r=x*x+a*x;break;default:e=`${a}x² − ${b}`;r=a*x*x-b;}
  const sub=e.replace(/(\d)x/g,'$1 × x').replace(/(\d)\(/g,'$1 × (').replace(/x/g,Pn(x));
  return Q.num(`Calcule <b>${e}</b> pour <b>x = ${F(x)}</b>`,r,{hint:`Remplace x par ${Pn(x)}. Rappel : ${a}x = ${a} × x.`,expl:`${sub} = ${F(r)}`});}},
{id:'5f',name:'Pourcentages',icon:'💯',
 f:{t:'Calculer un pourcentage',l:['t % de N = N × t ÷ 100','10 % : divise par 10. 50 % : la moitié. 25 % : le quart.'],ex:'20 % de 60 = 60 × 20 ÷ 100 = 12'},
 g(d){const t=P([[10,50,25],[10,20,25,50,75,5],[15,30,12,35,60,40]][d-1]),N=R(1,20)*20,r=rd(t*N/100);
  return Q.num(`Calcule <b>${t} %</b> de <b>${N}</b>.`,r,{hint:`${N} × ${t} ÷ 100`,expl:`${N} × ${t} ÷ 100 = ${F(r)}`});}},
{id:'5g',name:'Angles du triangle',icon:'📐',
 f:{t:'Somme des angles',l:['Dans tout triangle : somme des 3 angles = 180°.','Triangle isocèle : les 2 angles à la base sont égaux.'],ex:'50° + 60° + ? = 180° donc ? = 70°'},
 g(d){if(d===3&&Math.random()<.5){const s=R(10,80)*2,r=(180-s)/2;return Q.num(`Triangle isocèle : l’angle principal mesure ${s}°. Combien mesure chaque angle à la base ?`,r,{unit:'°',hint:'Les 2 angles à la base sont égaux et le total fait 180°.',expl:`(180 − ${s}) ÷ 2 = ${r}°`});}
  const a=R(20,100),b=R(20,160-a),r=180-a-b;return Q.num(`Un triangle a deux angles de <b>${a}°</b> et <b>${b}°</b>. Le troisième ?`,r,{unit:'°',hint:'La somme des angles d’un triangle vaut 180°.',expl:`180 − ${a} − ${b} = ${r}°`});}},
{id:'5h',name:'Moyenne',icon:'📊',
 f:{t:'Calculer une moyenne',l:['Additionne toutes les valeurs.','Divise par le nombre de valeurs.'],ex:'Notes 12, 14, 10 : (12 + 14 + 10) ÷ 3 = 12'},
 g(d){const n=d+2,m=R(8,14);let v;do{v=[];let s=0;for(let i=0;i<n-1;i++){const x=m+R(-5,5);v.push(x);s+=x;}v.push(n*m-s);}while(v.some(x=>x<0||x>20));
  return Q.num(`Notes : <b>${v.join(' ; ')}</b>. Moyenne ?`,m,{hint:'Additionne tout, puis divise par le nombre de notes.',expl:`(${v.join(' + ')}) ÷ ${n} = ${n*m} ÷ ${n} = ${m}`});}},
{id:'5i',name:'Divisibilité',icon:'🔍',
 f:{t:'Critères de divisibilité',l:['Par 2 : dernier chiffre pair. Par 5 : finit par 0 ou 5. Par 10 : finit par 0.','Par 3 : somme des chiffres divisible par 3.','Par 9 : somme des chiffres divisible par 9.'],ex:'162 : 1 + 6 + 2 = 9, donc divisible par 3 et par 9'},
 g(d){const RU={2:'dernier chiffre pair',3:'somme des chiffres divisible par 3',5:'dernier chiffre 0 ou 5',9:'somme des chiffres divisible par 9',10:'dernier chiffre 0'};const k=P([2,3,5,9,10]),yes=Math.random()<.5;let N=k*R(12,[50,200,1200][d-1]);if(!yes)N+=R(1,k-1);
  const ds=String(N).split('').reduce((a,c)=>a+ +c,0),x=(k===3||k===9)?` (ici ${ds})`:'';
  return Q.ch(`<b>${N}</b> est-il divisible par <b>${k}</b> ?`,yes?'Oui':'Non',[yes?'Non':'Oui'],{hint:'Règle : '+RU[k]+'.',expl:`Règle : ${RU[k]}${x}. Donc ${yes?'oui':'non'}.`});}},
{id:'5j',name:'Cercle et disque',icon:'⭕',
 f:{t:'Cercle et disque',l:['Périmètre du cercle = 2 × π × r','Aire du disque = π × r × r','On prend π ≈ 3,14. Rayon = diamètre ÷ 2'],ex:'r = 2 cm : P = 12,56 cm et A = 12,56 cm²'},
 g(d){const useD=d===3&&Math.random()<.5,r=R(1,[6,10,15][d-1]),giv=useD?`de diamètre <b>${2*r} cm</b>`:`de rayon <b>${r} cm</b>`,hd=useD?' (rayon = diamètre ÷ 2)':'';
  if(d>1&&Math.random()<.5){const A=rd(3.14*r*r);return Q.num(`Aire d’un disque ${giv} ? (π ≈ 3,14)`,A,{unit:'cm²',tol:.011,hint:'Aire = π × r × r'+hd,expl:`3,14 × ${r} × ${r} = ${F(A)} cm²`});}
  const p=rd(2*3.14*r);return Q.num(`Périmètre d’un cercle ${giv} ? (π ≈ 3,14)`,p,{unit:'cm',tol:.011,hint:'Périmètre = 2 × π × r'+hd,expl:`2 × 3,14 × ${r} = ${F(p)} cm`});}}
],
'4':[
{id:'4a',name:'Multiplier des relatifs',icon:'⚡',
 f:{t:'Règle des signes',l:['Même signe : résultat positif.','Signes contraires : résultat négatif.','Pareil pour la division.'],ex:'(−3) × (−4) = 12 et (−20) ÷ 5 = −4'},
 g(d){const L=[6,10,12][d-1],a=nz(-L,L),b=nz(-L,L),h='Même signe : +. Signes contraires : −.';
  if(Math.random()<.5){const r=a*b;return Q.num(`${F(a)} × ${Pn(b)} = ?`,r,{hint:h,expl:`${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(r)}, signe ${r>0?'+':'−'} : ${F(r)}`});}
  const A=a*b;return Q.num(`${F(A)} ÷ ${Pn(b)} = ?`,a,{hint:h,expl:`${Math.abs(A)} ÷ ${Math.abs(b)} = ${Math.abs(a)}, signe ${a>0?'+':'−'} : ${F(a)}`});}},
{id:'4b',name:'Puissances',icon:'🚀',
 f:{t:'Les puissances',l:['aⁿ = a × a × … × a (n fois)','10³ = 1 000 et 10⁻² = 0,01','a⁰ = 1'],ex:'2⁵ = 2 × 2 × 2 × 2 × 2 = 32'},
 g(d){const t=d===1?R(0,2):d===2?R(3,5):R(5,7);let b,n;
  switch(t){case 0:b=2;n=R(2,6);break;case 1:b=10;n=R(2,6);break;case 2:b=R(2,12);n=2;break;case 3:b=3;n=R(2,4);break;case 4:b=5;n=3;break;case 5:b=-2;n=R(2,5);break;case 6:b=10;n=-R(1,4);break;default:b=R(2,20);n=0;}
  const r=rd(Math.pow(b,n)),bs=b<0?`(${F(b)})`:b,disp=bs+sup(n<0?'−'+(-n):n);
  return Q.num(`${disp} = ?`,r,{hint:n<0?`10${sup('−'+(-n))} = 1 ÷ 10${sup(-n)}`:n===0?'Tout nombre non nul puissance 0 vaut 1.':`${disp} = ${Array(n).fill(bs).join(' × ')}`,expl:`${disp} = ${F(r)}`});}},
{id:'4c',name:'Multiplier des fractions',icon:'🧩',
 f:{t:'Produit et quotient de fractions',l:['a/b × c/d = (a × c) / (b × d)','Diviser par une fraction = multiplier par son inverse.','Écris ta réponse comme ça : 6/35'],ex:'2/3 × 4/5 = 8/15'},
 g(d){const a=R(1,9),b=R(2,9),c=R(1,9),e=R(2,9);
  if(d===3&&Math.random()<.5)return Q.frac(`${fr(a,b)} ÷ ${fr(c,e)} = ?`,a*e,b*c,{hint:'Diviser par une fraction = multiplier par son inverse.',expl:`${fr(a,b)} × ${fr(e,c)} = ${fr(a*e,b*c)}`});
  return Q.frac(`${fr(a,b)} × ${fr(c,e)} = ?`,a*c,b*e,{hint:'Haut × haut, bas × bas.',expl:`${fr(a,b)} × ${fr(c,e)} = ${fr(a*c,b*e)}`});}},
{id:'4d',name:'Réduire une expression',icon:'🧹',
 f:{t:'Réduire',l:['On regroupe les « x » ensemble.','On regroupe les nombres seuls ensemble.','Écris ta réponse comme ça : 5x+3'],ex:'4x + 2 + 3x − 5 = 7x − 3'},
 g(d){const a=R(2,9),b=R(2,9);let k,m,e;
  if(d===1){k=a+b;m=0;e=`${a}x + ${b}x`;}
  else if(d===2){const A=b+R(2,8),c=R(1,9);k=A-b;m=c;e=`${A}x − ${b}x + ${c}`;}
  else{const c=R(1,9);let f=R(1,9);if(f===c)f=c%9+1;k=a+b;m=c-f;e=`${a}x + ${c} + ${b}x − ${f}`;}
  const acc=m===0?[`${k}x`]:m>0?[`${k}x+${m}`,`${m}+${k}x`]:[`${k}x${m}`,`${m}+${k}x`];

const fy=y=>y<0?(y<=-10000?`vers ${(-y).toLocaleString('fr-FR')} av. J.-C.`:`${-y} av. J.-C.`):String(y);
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
function hgq(b,d){const g=[];
 if(b.q){g.push(()=>{const [q,a,w,e]=P(b.q);return Q.ch(q,a,shuffle(w.split('|')).slice(0,3),{hint:'Élimine d’abord les réponses impossibles.',expl:e});});g.push(g[g.length-1]);}
 if(b.d)g.push(()=>{const it=P(b.d),oth=shuffle(b.d.filter(x=>x!==it)).slice(0,3),f=d===3?R(1,2):R(0,1);
  if(f===0)return Q.ch(`Que signifie <b>« ${it[0]} »</b> ?`,cap1(it[1]),oth.map(o=>cap1(o[1])),{hint:'Pense à une phrase du cours où ce mot apparaît.',expl:`${cap1(it[0])} : ${it[1]}.`});
  if(f===1)return Q.ch(`Quel mot correspond à cette définition ?<div class="stmt">${cap1(it[1])}</div>`,cap1(it[0]),oth.map(o=>cap1(o[0])),{hint:'Relis le vocabulaire du cours.',expl:`${cap1(it[0])} : ${it[1]}.`});
  return Q.txt(`Écris le mot qui correspond à cette définition :<div class="stmt">${cap1(it[1])}</div>`,[it[0]],{lang:'fr',hint:`Ça commence par « ${it[0][0].toUpperCase()} » (${it[0].length} caractères).`,expl:`${cap1(it[0])} : ${it[1]}.`});});
 if(b.c&&b.c.length>=3){
  g.push(()=>{const [y,l]=P(b.c),pool=[...new Set([...b.c.map(x=>x[0]),y+10,y-10,y+50,y-50,y+100])].filter(x=>x!==y);
   return Q.ch(`Quelle est la date de cet événement ?<div class="stmt">${l}</div>`,fy(y),shuffle(pool).slice(0,3).map(fy),{hint:'Situe-le sur la frise du cours : avant ou après les autres ?',expl:`${l} : ${fy(y)}.`});});
  if(d>1)g.push(()=>{const seen=new Set(),ev=shuffle([...b.c]).filter(e=>!seen.has(e[0])&&seen.add(e[0])).slice(0,d===2?3:4).sort((a,b)=>a[0]-b[0]),toks=ev.map(e=>e[1]);
   let sh=shuffle([...toks]),k=0;while(sh.join('|')===toks.join('|')&&k++<20)sh=shuffle([...toks]);
   return {type:'order',q:'Remets ces événements dans l’ordre chronologique, du plus ancien au plus récent.',tokens:sh,ans:toks.join(' '),hint:`Le plus ancien : « ${toks[0]} ».`,expl:ev.map(e=>`<b>${fy(e[0])}</b> : ${e[1]}`).join('<br>')};});}
 if(b.t)g.push(()=>{const [s,v,e]=P(b.t);return Q.ch(`Vrai ou faux ?<div class="stmt">${s}</div>`,v?'Vrai':'Faux',[v?'Faux':'Vrai'],{hint:'Relis l’essentiel du cours.',expl:`${v?'Vrai':'Faux'}. ${e}`});});
 return P(g)();}

hc('hg4k','E','L’État de droit et les libertés','🗽','Peut-on tout dire ? Tout faire ? Être arrêté sans raison ? Dans un État de droit, la loi protège tes libertés… et fixe leurs limites.',

  d:[['État de droit','État où chacun, y compris le pouvoir, est soumis au droit'],['liberté fondamentale','liberté essentielle garantie par la Constitution'],['présomption d’innocence','principe selon lequel on est innocent tant que la culpabilité n’est pas prouvée'],['diffamation','accusation qui porte atteinte à l’honneur d’une personne'],['procès équitable','procès où chacun peut se défendre devant un juge impartial']],

 if(!levels.length)return;
 const worlds=levels.map(l=>({id:sid+l,lvl:l+'e',name:(meta.worldNames&&meta.worldNames[l])||meta.name,emoji:meta.emoji,col:meta.color||'#64748b'}));
 levels.forEach((l,i)=>CH_EXTRA[worlds[i].id]=byLvl(sid,l));
 EXTRA_SUBJECTS.push({id:sid,name:meta.name,emoji:meta.emoji,worlds});
});
/* École primaire (CP → CM2) : mêmes données que l’appli (js/primary-engine.js + data/primary/*.js). */
const PRIMARY=window.MQPrimary?MQPrimary.build():{subjects:[],chapters:{}};
const SUBJECTS=[{id:'maths',name:'Maths',emoji:'🧮',worlds:WORLDS},{id:'francais',name:'Français',emoji:'✒️',worlds:WORLDS_FR},{id:'anglais',name:'Anglais',emoji:'🇬🇧',worlds:WORLDS_EN},{id:'italien',name:'Italien',emoji:'🇮🇹',worlds:WORLDS_IT},{id:'hg',name:'Histoire-Géo',emoji:'🌍',worlds:WORLDS_HG}].concat(EXTRA_SUBJECTS).concat(PRIMARY.subjects);
const WCH={...CH,...CH_FR,...CH_EN,...CH_IT,...CH_HG,...CH_EXTRA,...PRIMARY.chapters},WALL=SUBJECTS.flatMap(s=>s.worlds),ALLCH=Object.values(WCH).flat(),WMAP={};
WALL.forEach(w=>WCH[w.id].forEach(c=>WMAP[c.id]=w));
const sOf=wid=>SUBJECTS.find(s=>s.worlds.some(w=>w.id===wid))||SUBJECTS[0];

/* ===== MathQuest – Page parent (suivi à distance) ===== */
const CONFIG={url:'https://nctmxxixugoxairmtjsa.supabase.co',key:'sb_publishable_ngN_Y9VsRuThBwS_pazV-A_0_hfbFWd'};
async function rpc(fn,args){const r=await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:CONFIG.key,'Content-Type':'application/json'},body:JSON.stringify(args)});const t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t?JSON.parse(t):null;}
const RULES=[['ok','Par bonne réponse'],['mission','Mission réussie (2 étoiles ou plus)'],['perfect','Bonus mission sans faute'],['goal','Objectif du jour atteint'],['streak','Chaque jour de série (dès le 2e jour)'],['lesson','Cours terminé (1re fois)']];
const TITLES=['Novice','As du calcul','Stratège','Prodige','Virtuose','Génie','Légende','Mythe'];
const lvl=xp=>Math.floor(Math.sqrt((xp||0)/150))+1,title=L=>TITLES[Math.min(TITLES.length-1,Math.floor((L-1)/2))];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number.isFinite(+x)?+x:0;
const starStr=n=>`<span class="st">${'★'.repeat(n)}<i>${'★'.repeat(3-n)}</i></span>`;
const ago=t=>{if(!t)return 'jamais';const s=Math.round((Date.now()-t)/1000);return s<60?'à l’instant':s<3600?`il y a ${Math.round(s/60)} min`:s<86400?`il y a ${Math.round(s/3600)} h`:`il y a ${Math.round(s/86400)} j`;};
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.innerHTML=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}

let PK=(location.hash||'').slice(1).trim();
try{if(PK)localStorage.setItem('mq_parent_key',PK);else PK=localStorage.getItem('mq_parent_key')||'';}catch(e){}
let D=null,TAB='suivi',DIRTY=false,ERR='';

async function refresh(force){if(!PK)return noKey();
 if(!force&&(DIRTY||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))))return;
 try{const r=await rpc('mq_get',{p_parent:PK});if(!r){ERR='Lien de suivi inconnu. Réactive le suivi dans l’appli de ton enfant.';D=null;}else{D=r;ERR='';}}
 catch(e){ERR='Connexion impossible. Nouvelle tentative dans quelques secondes.';}
 render();}
function noKey(){app.innerHTML=`<div class="card center pop"><div class="logo">🔑</div><h1>Suivi parent</h1><p class="muted">Ouvre le lien de suivi affiché dans l’appli de ton enfant (Espace parents, onglet Réglages, Suivi à distance), ou colle-le ici.</p><input id="lk" class="fld wide2" placeholder="https://…/parent.html#…"><button class="btn primary big" data-a="setkey">Valider</button></div>`;}

function render(){
 if(ERR&&!D){app.innerHTML=`<div class="card center"><p class="lead">⚠️ ${esc(ERR)}</p><button class="btn primary big" data-a="reload">Réessayer</button></div>`;return;}
 if(!D)return;
 const S=D.data||{},m=S.merit||{pts:0,req:[],rewards:[],hist:[],rules:{}},seen=S.lastSeen||Date.parse(D.updated_at),online=Date.now()-seen<120000;
 const L=lvl(S.xp),pend=(D.pending||[]),reqN=(m.req||[]).length;
 app.innerHTML=`<header class="top"><div class="av">${esc(S.avatar||'🦊')}</div><div class="who"><div class="nm">${esc(S.name||'MathQuest')}</div><div class="tt">Niveau ${L} : ${title(L)}</div>
  <div class="small live ${online?'':'off'}"><i></i>${online?'En train de jouer':'Vue '+ago(seen)}</div></div><div class="pills"><span class="pill">🎖️ ${num(m.pts)}</span><button class="pill" data-a="reload" aria-label="Actualiser">🔄</button></div></header>
 ${ERR?`<div class="note">⚠️ ${esc(ERR)}</div>`:''}
 ${pend.length?`<div class="note">⏳ ${pend.length} action${pend.length>1?'s':''} en attente : appliquée${pend.length>1?'s':''} dès que l’appli de ${esc(S.name||'ton enfant')} sera ouverte.</div>`:''}
 <div class="tabs">${[['suivi','📊 Suivi'],['recomp','🎁 Récompenses'],['reglages','⚙️ Règles']].map(([k,l])=>`<button class="tab ${k===TAB?'on':''}" data-a="tab:${k}">${l}${k==='recomp'&&reqN?` <span class="dotn">${reqN}</span>`:''}</button>`).join('')}</div>
 ${TAB==='suivi'?suivi(S,m):TAB==='recomp'?recomp(S,m,pend):regles(m,pend)}
 <p class="muted small center">Actualisation automatique toutes les 15 secondes.</p>`;
 DIRTY=false;}

function suivi(S,m){const tq=num(S.totalQ),acc=tq?Math.round(num(S.totalOk)/tq*100):0,mins=Math.round(num(S.time)/60),chap=S.chap||{},d=S.daily||{};
 const G=String(S.grade||''),stat=w=>{let ok=0,tot=0;WCH[w.id].forEach(c=>{const s=chap[c.id];if(s){ok+=num(s.ok);tot+=num(s.tot);}});return {ok,tot};};
 const shown=WALL.filter(w=>w.lvl===G||stat(w).tot>0),mineCh=WALL.filter(w=>w.lvl===G).flatMap(w=>WCH[w.id]);
 const today=(()=>{const x=new Date();return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();})(),dok=d.date===today?num(d.ok):0;
 const weak=ALLCH.map(c=>({c,s:chap[c.id]})).filter(x=>x.s&&x.s.tot>=4).map(x=>({...x,a:x.s.ok/x.s.tot})).filter(x=>x.a<.8).sort((a,b)=>a.a-b.a).slice(0,5);
 return `<div class="kpis"><div class="kpi"><b>${dok}/20</b><span>bonnes réponses aujourd’hui</span></div><div class="kpi"><b>${acc} %</b><span>de réussite (${tq} questions)</span></div><div class="kpi"><b>${Math.floor(mins/60)} h ${String(mins%60).padStart(2,'0')}</b><span>de travail au total</span></div><div class="kpi"><b>🔥 ${num(S.streak?.n)}</b><span>jours de suite (record ${num(S.streak?.best)})</span></div><div class="kpi"><b>📖 ${(mineCh.length?mineCh:ALLCH).filter(c=>(S.lessons||{})[c.id]).length}/${(mineCh.length?mineCh:ALLCH).length}</b><span>cours terminés${G?' ('+esc(G)+')':''}</span></div></div>
 <h2 class="sec">À retravailler en priorité</h2>${weak.length?weak.map(x=>`<div class="row"><span>${x.c.icon} ${x.c.name} <small class="muted">${sOf(WMAP[x.c.id].id).emoji} ${WMAP[x.c.id].lvl}</small></span><b class="${x.a<.5?'lo':'mid'}">${Math.round(x.a*100)} %</b></div>`).join(''):'<p class="muted">Rien à signaler (analyse à partir de 4 questions par chapitre).</p>'}
 <h2 class="sec">Détail par matière${G?' ('+esc(G)+' et niveaux déjà travaillés)':''}</h2>${(shown.length?shown:WALL).map(w=>{const {ok,tot}=stat(w);const a=tot?Math.round(ok/tot*100):0;
  return `<details class="card det"><summary><span>${sOf(w.id).emoji} ${esc(sOf(w.id).name)} ${w.lvl}</span><span class="mbar"><i style="width:${a}%;background:${w.col}"></i></span><b>${tot?a+' %':'–'}</b></summary>${WCH[w.id].map(c=>{const s=chap[c.id];return `<div class="drow"><span>${c.icon} ${c.name}</span>${starStr(Math.min(3,num(s?.stars)))}<span class="muted">${s?`${num(s.ok)}/${num(s.tot)}`:'–'}</span></div>`;}).join('')}</details>`;}).join('')}
 ${lecture(S)}
 <h2 class="sec">Derniers bons points</h2>${(m.hist||[]).length?m.hist.slice(0,15).map(h=>`<div class="drow2"><span class="muted">${new Date(h.t).toLocaleDateString('fr-FR')}</span><span>${esc(h.w)}</span><b class="${h.d<0?'lo':'okc'}">${h.d>0?'+':''}${num(h.d)}</b></div>`).join(''):'<p class="muted">Rien pour le moment.</p>'}`;}

// Lecture et compréhension : même rubrique que l’espace parents de l’appli (js/app-actions.js, readingParentBody).
function lecture(S){if(!window.MQReading)return '';
 const comps=MQReading.masterySummary(S).sort((a,b)=>a.value-b.value),prog=S.readingProgress||{};
 const texts=Object.entries(prog).map(([id,p])=>({r:MQReading.get(id),p:p||{}})).filter(x=>x.r).sort((a,b)=>num(b.p.lastSeen)-num(a.p.lastSeen));
 const cls=v=>v<50?'lo':v<85?'mid':'okc';
 if(!comps.length)return `<h2 class="sec">📖 Lecture et compréhension</h2><p class="muted">Pas encore de texte lu. Les textes apparaissent dans certains cours de français (étape « Je lis »).</p>`;
 return `<h2 class="sec">📖 Lecture et compréhension <small class="muted">(${texts.length} texte${texts.length>1?'s':''} lu${texts.length>1?'s':''})</small></h2>
 <div class="card">${comps.map(c=>{const v=Math.max(0,Math.min(100,Math.round(num(c.value))));return `<div class="drow rdrow"><span>${esc(c.label)} <small class="muted">(${num(c.n)} question${num(c.n)>1?'s':''})</small></span><span class="mbar" aria-hidden="true"><i style="width:${v}%"></i></span><b class="${cls(v)}">${v} %</b></div>`;}).join('')}
 <p class="muted small">Chaque compétence est estimée sur 100 à partir des questions de lecture. Une réponse trouvée avec des indices compte moins qu’une réponse trouvée seul.</p></div>
 ${texts.length?`<div class="card">${texts.slice(0,8).map(x=>{const b=Math.max(0,Math.min(100,Math.round(num(x.p.bestScore))));return `<div class="drow rdtx"><span>${esc(x.r.title)} <small class="muted">${esc(x.r.level)}</small></span><b class="${cls(b)}">${b} % <small class="muted">(${num(x.p.attempts)||1} fois)</small></b></div>`;}).join('')}</div>`:''}`;}

function recomp(S,m,pend){const waiting=id=>pend.some(a=>(a.kind==='accept'||a.kind==='refuse')&&a.payload&&a.payload.req===id);const rwPend=pend.some(a=>a.kind==='rewards');
 return `<div class="card mbal"><span class="muted">Solde de ${esc(S.name)}</span><b>🎖️ ${num(m.pts)}</b><small class="muted">${num(m.total)} gagnés au total</small></div>
 <h2 class="sec">Demandes de ${esc(S.name)}</h2>${(m.req||[]).length?m.req.map(r=>{const w=(m.rewards||[]).find(x=>x.id===r.rid);if(!w)return '';return `<div class="card rq"><span class="re">${esc(w.e)}</span><div class="grow"><b>${esc(w.n)}</b><div class="muted small">${num(w.c)} 🎖️, demandé le ${new Date(r.t).toLocaleDateString('fr-FR')}</div></div>${waiting(r.id)?'<span class="pill">⏳ Envoyé</span>':`<button class="btn primary sm2" data-a="acc:${esc(r.id)}">Accorder</button><button class="btn ghost sm2" data-a="ref:${esc(r.id)}">Refuser</button>`}</div>`;}).join(''):'<p class="muted">Aucune demande.</p>'}
 <h2 class="sec">Donner ou retirer des bons points</h2><div class="card"><div class="frow"><input id="bn" class="fld num" type="number" min="1" value="10" aria-label="Nombre de points"><input id="br" class="fld grow" maxlength="60" placeholder="Raison (ex : bonne note au contrôle)"></div><div class="frow"><button class="btn primary grow" data-a="bonus:1">+ Donner</button><button class="btn grow" data-a="bonus:-1">− Retirer</button></div></div>
 <h2 class="sec">Liste des récompenses</h2>${rwPend?'<div class="note">⏳ Une nouvelle liste est en attente d’envoi.</div>':''}<p class="muted small">Emoji, récompense, bons points nécessaires. Pense à enregistrer.</p>
 <div id="rwl">${(m.rewards||[]).map(w=>rwRow(w)).join('')}</div>
 <div class="frow"><button class="btn grow" data-a="rwadd">+ Ajouter</button><button class="btn primary grow" data-a="rwsave">💾 Enregistrer</button></div>`;}
const rwRow=w=>`<div class="frow rw" data-id="${esc(w.id)}"><input class="fld em" value="${esc(w.e)}" maxlength="8" aria-label="Emoji"><input class="fld grow" value="${esc(w.n)}" maxlength="50" aria-label="Récompense"><input class="fld num" type="number" min="1" value="${num(w.c)}" aria-label="Bons points"><button class="btn ghost sm2" data-a="rwdel" aria-label="Supprimer">🗑️</button></div>`;

function regles(m,pend){const r=m.rules||{};return `${pend.some(a=>a.kind==='rules')?'<div class="note">⏳ De nouvelles règles sont en attente d’envoi.</div>':''}<div class="card">${RULES.map(([k,l])=>`<label class="frow"><span class="grow">${l}</span><input class="fld num" type="number" min="0" id="ru_${k}" value="${num(r[k])}"></label>`).join('')}<button class="btn primary wide" data-a="rulesave">💾 Enregistrer</button></div>
 <p class="muted small">Le code parent de l’appli et la réinitialisation restent accessibles uniquement sur le téléphone de ${esc(D.data?.name||'ton enfant')}.</p>`;}

async function act(kind,payload,msg){try{await rpc('mq_act',{p_parent:PK,p_kind:kind,p_payload:payload});toast(msg||'✅ Envoyé');DIRTY=false;await refresh(true);}catch(e){toast('⚠️ Envoi impossible, vérifie ta connexion');}}
const ACT={
 reload:()=>refresh(true),tab:k=>{TAB=k;DIRTY=false;render();},
 setkey:()=>{const v=$('#lk').value.trim();const k=v.includes('#')?v.split('#').pop():v;if(k.length<20)return toast('Lien invalide');location.hash=k;PK=k;try{localStorage.setItem('mq_parent_key',k);}catch(e){}refresh(true);},
 acc:id=>act('accept',{req:id},'✅ Récompense accordée'),ref:id=>act('refuse',{req:id},'Demande refusée'),
 bonus:sg=>{const n=parseInt($('#bn').value),why=$('#br').value.trim();if(!(n>0))return toast('Indique un nombre de points');act('bonus',{n:+sg>0?n:-n,why},`${+sg>0?'+':'−'}${n} 🎖️ envoyé`);},
 rwadd:()=>{DIRTY=true;$('#rwl').insertAdjacentHTML('beforeend',rwRow({id:'r'+Date.now(),e:'🎁',n:'Nouvelle récompense',c:100}));const f=[...document.querySelectorAll('#rwl .rw')].pop().querySelectorAll('input')[1];f.focus();f.select();},
 rwdel:(_,el)=>{DIRTY=true;el.closest('.rw').remove();},
 rwsave:()=>{const list=[...document.querySelectorAll('#rwl .rw')].map(r=>{const f=r.querySelectorAll('input');return{id:r.dataset.id,e:f[0].value.trim()||'🎁',n:f[1].value.trim(),c:Math.max(1,parseInt(f[2].value)||1)};}).filter(w=>w.n);act('rewards',{list},'💾 Récompenses envoyées');},
 rulesave:()=>{const rules={};RULES.forEach(([k])=>rules[k]=Math.max(0,parseInt($('#ru_'+k).value)||0));act('rules',{rules},'💾 Règles envoyées');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const s=el.dataset.a,i=s.indexOf(':'),a=i<0?s:s.slice(0,i),arg=i<0?undefined:s.slice(i+1);if(ACT[a])ACT[a](arg,el);});
document.addEventListener('input',e=>{if(e.target.closest('#rwl'))DIRTY=true;});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
refresh(true);setInterval(()=>{if(document.visibilityState==='visible')refresh();},15000);
</script></body></html>
