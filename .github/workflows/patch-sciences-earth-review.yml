name: Patch sciences Earth review

on:
  push:
    branches:
      - amelioration/cours-approfondis-sciences

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amelioration/cours-approfondis-sciences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Appliquer la correction revue
        run: python3 .github/scripts/finalize-sciences-review.py
      - name: Vérifier la syntaxe
        run: |
          node --check data/pedagogy/course-depth-sciences-primary.js
          node --check tests/course-depth.test.js
          grep -F "scienceProfile:k" data/pedagogy/course-depth-sciences-primary.js
          grep -F "profil Terre & espace" tests/course-depth.test.js
      - name: Committer la correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pedagogy/course-depth-sciences-primary.js tests/course-depth.test.js
          git commit -m "Ajoute la non-régression Terre et espace"
          git push origin HEAD:amelioration/cours-approfondis-sciences
