name: MathQuest CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  normalize-science-typography:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amelioration/cours-approfondis-sciences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normaliser la typographie française
        shell: python
        run: |
          from pathlib import Path
          p=Path('data/pedagogy/course-depth-sciences-primary.js')
          s=p.read_text(encoding='utf-8')
          for old,new in [('« ','«\u00a0'),(' »','\u00a0»'),(' :','\u00a0:'),(' ;','\u00a0;'),(' !','\u00a0!'),(' ?','\u00a0?')]:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Vérifier et pousser
        run: |
          node --check data/pedagogy/course-depth-sciences-primary.js
          if grep -nE '« | »| [:;!?]' data/pedagogy/course-depth-sciences-primary.js; then
            echo 'Ponctuation française sécable encore présente' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pedagogy/course-depth-sciences-primary.js
          git commit -m "Normalise la typographie des packs de sciences"
          git push origin HEAD:amelioration/cours-approfondis-sciences
