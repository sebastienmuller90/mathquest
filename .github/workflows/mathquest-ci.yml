name: MathQuest CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  patch-science-profile-priority:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amelioration/cours-approfondis-sciences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corriger la priorité domaine puis nom
        shell: python
        run: |
          from pathlib import Path

          p=Path('data/pedagogy/course-depth-sciences-primary.js')
          s=p.read_text(encoding='utf-8')
          new_profile="""function profile(domain,name){const d=String(domain||'').toLowerCase(),n=String(name||'').toLowerCase();
          // Un domaine explicite est prioritaire : le titre ne doit jamais le détourner vers une autre famille.
          if(/météo|climat|atmosph|terre|planète|astronom|géolog|volcan|séisme|ressource/.test(d))return 'earth';
          if(/objet|techni|électric|numérique|machine/.test(d))return 'tech';
          if(/corps|santé|humain|alimentation/.test(d))return 'health';
          if(/vivant|animal|plante|écosyst|environnement|reproduction|croissance|développement|germination/.test(d))return 'living';
          if(/matière|eau|air|mélange|énergie|physique|mouvement|force|vitesse|lumière|ombre|son/.test(d))return 'matter';
          if(/temps|histoire/.test(d))return 'time';
          if(/espace|géograph|territoire|monde/.test(d))return 'space';
          // Un domaine ambigu (par ex. « Signaux ») est affiné par le nom du chapitre.
          if(/lune|soleil|étoile|satellite|système solaire|astronom|météo|climat|terre|planète|géolog|volcan|séisme/.test(n))return 'earth';
          if(/objet|techni|électric|numérique|machine|circuit|programm/.test(n))return 'tech';
          if(/corps|santé|humain|alimentation|digestion|respiration|hygiène/.test(n))return 'health';
          if(/vivant|animal|plante|écosyst|reproduction|croissance|développement|germination/.test(n))return 'living';
          if(/matière|eau|air|mélange|énergie|physique|mouvement|force|vitesse|signal|lumière|ombre|son/.test(n))return 'matter';
          if(/temps|histoire/.test(n))return 'time';
          if(/espace|géograph|territoire|monde|carte/.test(n))return 'space';
          if(/signal/.test(d))return 'matter';
          return 'method';}
          """.replace('\n          ','\n')
          start=s.index('function profile(')
          end=s.index('const PACK={',start)
          s=s[:start]+new_profile+s[end:]
          old_call="function entry(ch,grade,sid){const k=profile(`${ch.domain||''} ${ch.name||''}`),p=PACK[k]||PACK.method,n=esc(ch.name),dom=esc(ch.domain||'sciences');"
          new_call="function entry(ch,grade,sid){const k=profile(ch.domain,ch.name),p=PACK[k]||PACK.method,n=esc(ch.name),dom=esc(ch.domain||'sciences');"
          if new_call not in s:
              if s.count(old_call)!=1: raise SystemExit('appel profile attendu introuvable')
              s=s.replace(old_call,new_call,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/course-depth.test.js')
          s=p.read_text(encoding='utf-8')
          old="const namedProfileExpected=[['cm1-sc-lumiere-ombres','matter'],['cm1-sc-lune','earth'],['cm1-sc-developpement','living']];"
          new="const namedProfileExpected=[['cm1-sc-lumiere-ombres','matter'],['cm1-sc-lune','earth'],['cm1-sc-developpement','living'],['cp-sc-objets','tech'],['cm2-sc-reproduction','health']];"
          if new not in s:
              if s.count(old)!=1: raise SystemExit('namedProfileExpected attendu introuvable')
              s=s.replace(old,new,1)
          s=s.replace("r.namedProfiles.length===3&&r.namedProfiles.every(x=>x[1]===x[2])","r.namedProfiles.length===5&&r.namedProfiles.every(x=>x[1]===x[2])",1)
          p.write_text(s,encoding='utf-8')
      - name: Vérifier et pousser
        run: |
          node --check data/pedagogy/course-depth-sciences-primary.js
          node --check tests/course-depth.test.js
          grep -F 'profile(ch.domain,ch.name)' data/pedagogy/course-depth-sciences-primary.js
          grep -F "['cp-sc-objets','tech']" tests/course-depth.test.js
          grep -F "['cm2-sc-reproduction','health']" tests/course-depth.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pedagogy/course-depth-sciences-primary.js tests/course-depth.test.js
          git commit -m "Préserve les domaines sciences explicites avant le nom"
          git push origin HEAD:amelioration/cours-approfondis-sciences
