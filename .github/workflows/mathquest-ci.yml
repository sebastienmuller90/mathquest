name: MathQuest CI

on:
  push:
  pull_request:

concurrency:
  group: mathquest-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          find js data tests -type f \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Tests de non-régression MathQuest
        run: node tests/mathquest-regression.mjs
      - name: Sonder le registre pédagogique actif
        run: node tests/registry-probe.mjs
      - name: Audit intégral des leçons et exercices
        run: node tests/full-content-audit-v2.mjs
      - name: Publier le rapport d’audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathquest-full-content-audit
          path: tests/full-content-audit-report.json
          if-no-files-found: ignore

  browser:
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      MQ_BROWSER: ${{ matrix.browser }}
      MQ_ENGINES: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances épinglées (package-lock.json)
        run: npm ci
      - name: Installer le navigateur ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Démarrer MathQuest localement
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mathquest-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/mathquest-http.log
          exit 1
      - name: Mise en page mobile réelle (5 tailles, géométrie, aucun élément masqué)
        run: node tests/mobile-layout.test.js
      - name: Architecture (points d’extension, réponse unique, mission isolée)
        if: matrix.browser == 'chromium'
        run: node tests/hooks.test.js
      - name: Scénarios réels (migration, stockage corrompu, profils, rechargements, parcours)
        if: matrix.browser == 'chromium'
        run: node tests/scenarios.test.js
      - name: "Calendrier civil : séries et changements d’heure Europe/Paris"
        if: matrix.browser == 'chromium'
        run: node tests/dst-streak.test.js
      - name: Lexique sans doublons et migration de progression
        if: matrix.browser == 'chromium'
        run: node tests/lexicon-cleanup.test.js
      - name: Accessibilité clavier et noms accessibles
        if: matrix.browser == 'chromium'
        run: node tests/keyboard-a11y.test.js
      - name: Voix de Finot en fin d’exercice
        if: matrix.browser == 'chromium'
        run: node tests/finot-voice.test.js
      - name: Cours approfondis (rien de retiré, contenu complet)
        if: matrix.browser == 'chromium'
        run: node tests/course-depth.test.js
      - name: Mode sombre lisible (contraste réel texte / fond)
        if: matrix.browser == 'chromium'
        run: node tests/dark-mode.test.js
      - name: Mise à jour de l’appli installée (N → N+1) et vrai démarrage hors ligne (serveur arrêté)
        run: node tests/pwa-update.test.js
      - name: Audit navigateur intégral
        run: node tests/browser-audit.mjs
      - name: Audit des 3 niveaux et de Finot
        run: node tests/pedagogy-browser-audit.mjs
      - name: Audit interrogation parent et statistiques
        run: node tests/interrogation-dashboard-browser-audit.mjs
      - name: Audit ciblé des remarques de revue
        run: node tests/review-findings-browser-audit.mjs
      - name: Audit des micro-compétences et du parcours adaptatif
        run: node tests/competency-browser-audit.mjs
      - name: Audit diagnostic, Finot erreur, transferts et UI par âge
        run: node tests/phase3-browser-audit.mjs
      - name: Audit des ateliers et contextes pédagogiques phase 4
        run: node tests/phase4-pedagogy-browser-audit.mjs
      - name: Audit ciblé des données CE2
        run: node tests/phase4-ce2-data-browser-audit.mjs
      - name: Audit des packs pédagogiques spécifiques
        run: node tests/chapter-packs-browser-audit.mjs
      - name: Publier rapports et captures navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathquest-browser-audit-${{ matrix.browser }}
          path: |
            tests/*-report.json
            tests/screenshots/*.png
          if-no-files-found: ignore
