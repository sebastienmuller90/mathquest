name: Patch sciences integration

on:
  push:
    branches: [amelioration/cours-approfondis-sciences]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amelioration/cours-approfondis-sciences
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Brancher sciences, versionner la PWA et renforcer les tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s:
                  return False
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: motif attendu exactement une fois, trouvé {s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              return True

          replace_once('index.html',
            '<script src="data/pedagogy/course-depth-anglais-cm2.js"></script>\n<script src="js/app-content.js"></script>',
            '<script src="data/pedagogy/course-depth-anglais-cm2.js"></script>\n<script src="data/pedagogy/course-depth-sciences-primary.js"></script>\n<script src="js/app-content.js"></script>')

          replace_once('sw.js',
            "const VERSION='8.67.0-series-quiz-erreurs-types-2026-10-22';",
            "const VERSION='8.68.0-cours-sciences-primary-2026-10-22';")

          p=Path('tests/course-depth.test.js'); s=p.read_text(encoding='utf-8')
          old="""  const lots2=lots.map(([g,re,min])=>{const want=ALLCH.filter(c=>WMAP[c.id]&&WMAP[c.id].lvl===g&&new RegExp(re).test(WMAP[c.id].name)).map(c=>c.id);\n   const missing=want.filter(id=>!C[id]);const thin=want.filter(id=>C[id]).map(id=>{const d=C[id];const n=(d.deep||[]).reduce((s,x)=>s+words(x.h),0)+words(d.culture&&d.culture.h)+String(d.adult||'').split(/\\s+/).length;return [id,n];}).filter(x=>x[1]<min);\n   const incomplete=want.filter(id=>{const d=C[id];return d&&!((d.deep||[]).length>=1&&d.try&&d.try.q&&d.try.a&&d.adult&&d.culture&&d.culture.h&&d.culture.t);});\n   return {g:re.replace(/[\\^$]/g,''),n:want.length,missing,thin,incomplete};});\n"""
          new=old+"""  const scienceTargets=[['CP','p-sciences'],['CE1','p-qlm'],['CE2','p-qlm'],['CM1','p-sciences'],['CM2','p-sciences']].map(([g,sid])=>{\n   const want=((((MQPrimary||{})._reg||{}).grades||{})[g]||{})[sid]||[];const ids2=want.map(ch=>ch.id);\n   const missing=ids2.filter(id=>!C[id]);const thin=ids2.filter(id=>C[id]).map(id=>{const d=C[id];const n=(d.deep||[]).reduce((sum,x)=>sum+words(x.h),0)+words(d.culture&&d.culture.h)+String(d.adult||'').split(/\\s+/).filter(Boolean).length;return [id,n];}).filter(x=>x[1]<200);\n   const incomplete=ids2.filter(id=>{const d=C[id];return d&&!((d.deep||[]).length>=2&&d.try&&d.try.q&&d.try.a&&d.adult&&d.culture&&d.culture.h&&d.culture.t);});\n   return {g,sid,n:ids2.length,missing,thin,incomplete};});\n"""
          if 'const scienceTargets=' not in s:
              if s.count(old)!=1: raise SystemExit(f'course-depth.test.js: insertion science introuvable ({s.count(old)})')
              s=s.replace(old,new,1)

          oldret='  return {count:ids.length,orphans,lots:lots2,order,place,bad,typos};},LOTS.map(([g,re,m])=>[g,re.source,m]));'
          newret='  return {count:ids.length,orphans,lots:lots2,scienceTargets,order,place,bad,typos};},LOTS.map(([g,re,m])=>[g,re.source,m]));'
          if newret not in s:
              if s.count(oldret)!=1: raise SystemExit('course-depth.test.js: retour attendu introuvable')
              s=s.replace(oldret,newret,1)

          anchor=""" for(const l of r.lots){T(`Lot ${l.g} : tous les chapitres couverts (${l.n})`,l.n>0&&!l.missing.length,l.missing.join(', '));\n  T(`Lot ${l.g} : chaque chapitre complet (explications, défi + réponse, conseil adulte, culture)`,!l.incomplete.length,l.incomplete.join(', '));\n  T(`Lot ${l.g} : contenu réellement plus détaillé (mots ajoutés par chapitre)`,!l.thin.length,JSON.stringify(l.thin));}\n"""
          extra=anchor+""" for(const l of r.scienceTargets){T(`Sciences ${l.g}/${l.sid} : tous les chapitres du registre couverts (${l.n})`,l.n>0&&!l.missing.length,l.missing.join(', '));\n  T(`Sciences ${l.g}/${l.sid} : enrichissement complet (2 explications, défi, adulte, culture)`,!l.incomplete.length,l.incomplete.join(', '));\n  T(`Sciences ${l.g}/${l.sid} : profondeur minimale de 200 mots ajoutés`,!l.thin.length,JSON.stringify(l.thin));}\n"""
          if 'Sciences ${l.g}/${l.sid} : tous les chapitres du registre couverts' not in s:
              if s.count(anchor)!=1: raise SystemExit('course-depth.test.js: bloc LOTS attendu introuvable')
              s=s.replace(anchor,extra,1)

          oldwalk=""" const walk=await p.evaluate(async()=>{openLesson('cp-ma-nombres100');const seen=[];let guard=0;"""
          newwalk=""" const walk=await p.evaluate(async()=>{openLesson('cp-sc-vivant');const seen=[];let guard=0;"""
          if newwalk not in s:
              if s.count(oldwalk)!=1: raise SystemExit('course-depth.test.js: parcours réel attendu introuvable')
              s=s.replace(oldwalk,newwalk,1)
          oldlabel="T('Cours réel « Nombres jusqu’à 100 » : explications, défi (réponse révélée au clic), culture, puis entraînement'"
          newlabel="T('Cours réel de sciences CP : explications, défi (réponse révélée au clic), culture, puis entraînement'"
          if newlabel not in s:
              if s.count(oldlabel)!=1: raise SystemExit('course-depth.test.js: libellé parcours attendu introuvable')
              s=s.replace(oldlabel,newlabel,1)
          p.write_text(s,encoding='utf-8')

      - name: Vérifier la syntaxe des fichiers modifiés
        run: |
          node --check data/pedagogy/course-depth-sciences-primary.js
          node --check tests/course-depth.test.js
          node --check sw.js
          grep -F 'course-depth-sciences-primary.js' index.html
          grep -F "8.68.0-cours-sciences-primary-2026-10-22" sw.js
      - name: Committer le patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js tests/course-depth.test.js
          git commit -m "Intègre les cours approfondis de sciences dans l'app et la CI"
          git push origin HEAD:amelioration/cours-approfondis-sciences
