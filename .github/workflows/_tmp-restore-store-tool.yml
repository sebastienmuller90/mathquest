name: TEMP restore Store screenshot tool

on:
  push:
    branches: ['chatgpt/store-chat-framing']
    paths:
      - '.github/workflows/_tmp-restore-store-tool.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/store-chat-framing
          fetch-depth: 0
      - name: Restaurer le blob complet validé
        run: |
          git show 4905b5c6145a7ee1535f35af7c32ddc65350b9d8:tools/store-screenshots.mjs > tools/store-screenshots.mjs
          rm .github/workflows/_tmp-restore-store-tool.yml
          node --check tools/store-screenshots.mjs
      - name: Committer la restauration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/store-screenshots.mjs .github/workflows/_tmp-restore-store-tool.yml
          git commit -m "fix: restaurer l'outil Store complet"
          git push origin HEAD:chatgpt/store-chat-framing
