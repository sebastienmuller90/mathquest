name: TTS fallback autopatch

on:
  push:
    branches:
      - chatgpt/tts-voice-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/tts-voice-fallback
          fetch-depth: 0
      - name: Appliquer le correctif minimal et auto-nettoyer ce workflow
        shell: python
        run: |
          from pathlib import Path

          audio = Path('js/audio-engine.js')
          text = audio.read_text(encoding='utf-8')
          old = "u.lang=pv.locale;if(pv.voice)u.voice=pv.voice;u.rate=sg.rate||(finot?pv.rate:rateFor(la,{slow:opt.slow,young:opt.young,type:sg.type}));u.pitch=finot?pv.pitch:1;"
          new = "u.lang=pv.locale;if(pv.voice)try{u.voice=pv.voice;}catch(e){}u.rate=sg.rate||(finot?pv.rate:rateFor(la,{slow:opt.slow,young:opt.young,type:sg.type}));u.pitch=finot?pv.pitch:1;"
          if old not in text:
              raise SystemExit('Snippet TTS attendu introuvable : aucun patch appliqué')
          text = text.replace(old, new, 1)
          text = text.replace('Moteur audio centralisé (synthèse vocale + reconnaissance), V8.13.', 'Moteur audio centralisé (synthèse vocale + reconnaissance), V8.14.', 1)
          text = text.replace("root.MQAudio={version:'8.13'", "root.MQAudio={version:'8.14'", 1)
          audio.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_version = "const VERSION='8.75.6-profile-purge-store-version-2026-11-02';"
          new_version = "const VERSION='8.75.7-tts-voice-fallback-2026-11-02';"
          if old_version not in sw_text:
              raise SystemExit('Version SW attendue introuvable : aucun patch appliqué')
          sw.write_text(sw_text.replace(old_version, new_version, 1), encoding='utf-8')

          Path('.github/workflows/tts-fallback-autopatch.yml').unlink()
      - name: Commit et push du GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/audio-engine.js sw.js .github/workflows/tts-fallback-autopatch.yml
          git commit -m "fix: replier la TTS sur la voix moteur si la voix native est refusée"
          git push origin HEAD:chatgpt/tts-voice-fallback
