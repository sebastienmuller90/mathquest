name: P3 apply exact layout fix

on:
  push:
    branches:
      - chatgpt/android-p3-layout
    paths:
      - '.github/workflows/p3-apply-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/android-p3-layout
      - name: Apply exact P3-E and P3-F replacements
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app-screens.js')
          s = p.read_text(encoding='utf-8')
          old1 = "function finotQuestionScreen(){return /^(mission|flash|lesson|interrogation|diagnostic)$/.test(CUR||'');}"
          new1 = "function finotQuestionScreen(){return /^(mission|flash|lesson|interrogation|diagnostic|homework-help)$/.test(CUR||'');}"
          old2 = "function hometabsSync(){const nav=document.getElementById('hometabs');if(!nav)return;const show=CUR==='home'&&!!S.name;nav.classList.toggle('show',show);if(!show)return;"
          new2 = "function hometabsSync(){const nav=document.getElementById('hometabs');if(!nav)return;const parentGate=!!document.querySelector('#app #pin,#app #pin2,#app #rk,#app #np2,#app .reckey'),show=CUR==='home'&&!!S.name&&!parentGate;nav.classList.toggle('show',show);if(!show)return;"
          old3 = "function finotFabSync(){const fab=document.querySelector('.finot-fab');if(!fab)return;const allowed=!!S.name&&!PARENT,show=allowed&&!finotQuestionScreen();fab.classList.toggle('show',show);fab.classList.toggle('raised',CUR==='home');const img=fab.querySelector('img');if(img)img.src=finotEtat(S).img;if(!allowed)finotClose();}"
          new3 = "function finotFabSync(){const fab=document.querySelector('.finot-fab');if(!fab)return;const allowed=!!S.name&&!PARENT,show=allowed&&!finotQuestionScreen();fab.classList.toggle('show',show);fab.classList.toggle('raised',CUR==='home');fab.setAttribute('aria-hidden',show?'false':'true');const img=fab.querySelector('img');if(img)img.src=finotEtat(S).img;if(!allowed)finotClose();}"
          for label, old in [('finotQuestionScreen', old1), ('hometabsSync', old2), ('finotFabSync', old3)]:
              if s.count(old) != 1:
                  raise SystemExit(f'{label} pattern count={s.count(old)}')
          p.write_text(s.replace(old1, new1).replace(old2, new2).replace(old3, new3), encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- js/app-screens.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-screens.js
          git commit -m 'fix(android): prevent homework and PIN overlay collisions'
          git push origin HEAD:chatgpt/android-p3-layout
