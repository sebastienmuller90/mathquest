name: TEMP apply release repo walker

on:
  push:
    branches: ['chatgpt/release-scan-generated-dirs']
    paths:
      - 'tests/repo-walk.js'
      - '.github/workflows/_tmp-apply-repo-walk.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/release-scan-generated-dirs
      - name: Brancher release-perf-audit sur le walker partagé
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('tests/release-perf-audit.test.js')
          s=p.read_text(encoding='utf-8')
          anchor="const {ROOT,swPrecache,seedProfile}=require('./lib');"
          if "require('./repo-walk')" not in s:
              s=s.replace(anchor,anchor+"\nconst {walkRepoFiles}=require('./repo-walk');")
          s,n=re.subn(r"function walk\(dir,out=\[\]\)\{[^\n]+\}\n",'',s,count=1)
          if n!=1:
              raise SystemExit('walker historique introuvable')
          s=s.replace("const imgFiles=walk('').filter(","const imgFiles=walkRepoFiles(ROOT).filter(")
          if "walk('')" in s:
              raise SystemExit('ancien appel walk encore présent')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/_tmp-apply-repo-walk.yml').unlink()
      - name: Committer le correctif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release-perf-audit.test.js tests/repo-walk.js .github/workflows/_tmp-apply-repo-walk.yml
          git commit -m "fix: ignorer les dossiers générés dans l'audit release"
          git push origin HEAD:chatgpt/release-scan-generated-dirs
