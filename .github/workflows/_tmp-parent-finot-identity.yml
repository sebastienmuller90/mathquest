name: TEMP parent Finot identity

on:
  push:
    branches: ['chatgpt/parent-finot-identity']
    paths:
      - '.github/workflows/_tmp-parent-finot-identity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/parent-finot-identity
      - name: Aligner la palette Parents et bumper le cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('parent.html')
          s=p.read_text(encoding='utf-8')
          pairs={
            '<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">':'<meta name="theme-color" content="#ff8a3d" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#241a12" media="(prefers-color-scheme: dark)">',
            '--bg:#f4f1ff;--surface:#ffffff;--surface2:#ece7ff;--text:#1f1a3d;--muted:#6a6590;--border:#ddd5fb;':'--bg:#fff6e8;--surface:#ffffff;--surface2:#ffe7d3;--text:#4a3426;--muted:#7a5f4a;--border:#f0e3d1;',
            '--accent:#7c3aed;--edge:rgba(31,26,61,.12);':'--accent:#ff8a3d;--edge:rgba(74,52,38,.12);',
            '--bg:#130f29;--surface:#1f1a3f;--surface2:#2b2554;--text:#f4f1ff;--muted:#a8a1d4;--border:#3a3370;':'--bg:#241a12;--surface:#332416;--surface2:#44301c;--text:#fff3e0;--muted:#c9ad91;--border:#5a4428;'
          }
          for a,b in pairs.items():
            if a not in s: raise SystemExit('motif parent absent: '+a[:60])
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          old="   8.75.8 : identité PWA Finot (manifeste orange/crème, icônes Finot « any » 192/512 et « maskable » 512) à livrer aux appareils installés. */"
          new="   8.75.8 : identité PWA Finot (manifeste orange/crème, icônes Finot « any » 192/512 et « maskable » 512) à livrer aux appareils installés.\n   8.75.9 : espace Parents aligné sur la palette orange/crème Finot Académie. */"
          if old not in s: raise SystemExit('commentaire sw 8.75.8 absent')
          s=s.replace(old,new).replace("const VERSION='8.75.8-pwa-finot-identity-2026-11-02';","const VERSION='8.75.9-parent-finot-identity-2026-11-02';")
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/_tmp-parent-finot-identity.yml').unlink()
      - name: Committer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parent.html sw.js .github/workflows/_tmp-parent-finot-identity.yml
          git commit -m "fix: aligner l'espace Parents sur l'identité Finot"
          git push origin HEAD:chatgpt/parent-finot-identity
